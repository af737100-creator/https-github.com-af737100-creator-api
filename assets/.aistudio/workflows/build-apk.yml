name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build React & Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm install

      - name: Add Capacitor Packages
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build React Production Assets
        run: npm run build

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Check Capacitor Configuration
        run: |
          if [ ! -f "capacitor.config.json" ]; then
            npx cap init "Secure Contacts" "com.secure.contacts" --web-dir="dist"
          fi

      - name: Add Android Native Wrapper
        run: npx cap add android || echo "Android platform already added or skipped"

      - name: Sync React Assets to native project
        run: npx cap sync android

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew
        continue-on-error: true

      - name: Compile Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Publish Built APK file
        uses: actions/upload-artifact@v4
        with:
          name: Secure-Contacts-v3.5
          path: android/app/build/outputs/apk/debug/app-debug.apk
